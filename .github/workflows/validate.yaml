name: Validate preset

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Renovate is intentionally unpinned: validate against the current engine, the same one Mend runs.
      - name: Validate default.json
        run: npx --yes --package renovate renovate-config-validator --no-global --strict default.json
